version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - chat_pg_data:/var/lib/postgresql/data

volumes:
  chat_pg_data: